<div>
  <h1>Configuração da conexão com Azure DevOps</h1>
  <p class="text-dim">Organização, projeto, time e credencial usados pra buscar e criar work items.</p>
</div>

<section class="card" style="max-width: 560px;">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="field">
      <label for="organizationUrl">Organização (URL)</label>
      <input
        type="text"
        id="organizationUrl"
        name="organizationUrl"
        [(ngModel)]="model.organizationUrl"
        placeholder="https://dev.azure.com/Ailos"
      />
    </div>

    <div class="field">
      <label for="project">Projeto</label>
      <input type="text" id="project" name="project" [(ngModel)]="model.project" placeholder="Ailos" />
    </div>

    <div class="field">
      <label for="team">Team</label>
      <input type="text" id="team" name="team" [(ngModel)]="model.team" placeholder="Nome do time no Azure DevOps" />
    </div>

    <div class="field">
      <label for="areaPath">Area Path (opcional)</label>
      <input type="text" id="areaPath" name="areaPath" [(ngModel)]="model.areaPath" placeholder="Ailos\Nome da Área" />
      <span class="hint">Restringe aos work items desse time quando iterações são compartilhadas entre times.</span>
    </div>

    <div class="field">
      <label for="pat">Personal Access Token (PAT)</label>
      <input
        type="password"
        id="pat"
        name="pat"
        [(ngModel)]="model.personalAccessToken"
        [placeholder]="hasStoredToken() ? 'Já configurado — deixe em branco para manter' : 'Cole seu PAT aqui'"
      />
    </div>

    @if (statusMessage()) {
      <div class="banner" [class.success]="status() === 'success'" [class.error]="status() === 'error'">
        {{ statusMessage() }}
      </div>
    }

    <div class="actions-bar">
      <button type="button" (click)="save()" [disabled]="status() === 'testing'">
        {{ status() === 'testing' ? 'Testando...' : 'Salvar e testar conexão' }}
      </button>
    </div>
  </div>
</section>
